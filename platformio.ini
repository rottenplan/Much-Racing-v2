[platformio]
src_dir = Firmware/src

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = no_ota.csv
monitor_speed = 115200
upload_speed = 115200


lib_deps =
    bodmer/TFT_eSPI @ ^2.5.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    tamctec/TAMC_GT911 @ ^1.0.2
    bblanchon/ArduinoJson @ ^7.0.0
    rfetick/MPU6050_light @ ^1.1.0
    knolleary/PubSubClient @ ^2.8
    electroniccats/MPU6050 @ ^1.3.1
    h2zero/NimBLE-Arduino @ ~1.4.0

    ; https://github.com/PaulStoffregen/XPT2046_Touchscreen.git (Removed)
; TFT_eSPI Configuration
; User provided setup (HSPI / S3-like pinout)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    ; HSPI Pins
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    ; TFT_RST is -1 as common for this board (Sunton/ESP32-3248S035C).
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TOUCH_CS=-1 ; Defined to silence warning, not used.
    
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=4000000
    -D SPI_TOUCH_FREQUENCY=2500000
